name: Verify Project Genesis
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: genesis
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: genesis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U genesis -d genesis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://genesis:test-only-password@localhost:5432/genesis_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run demo
      - run: npm run build
      - run: docker build -t project-genesis-runtime .
